name: ObtainX R02 / API 36 Hosted Emulator Bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obtainx-r02-api36-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-api36:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - name: Enforce emulator bootstrap source and mutation contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s scripts/ci -p 'test_r02_api36_contract.py' -v
          python3 -B scripts/ci/r02_api36_contract.py --check
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # pinned v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter 3.47.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # pinned v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - name: Provision Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # pinned
      - name: Initialize source-bound failure receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_OS" = Linux
          test "$(uname -m)" = x86_64
          mkdir -p "$RUNNER_TEMP/obtainx-r02-api36"
          python3 -B scripts/ci/r02_api36_smoke.py init --out "$RUNNER_TEMP/obtainx-r02-api36"
      - name: Build unsigned-for-release debug APK (normal flavor)
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --debug --flavor normal --no-pub
          test -s build/app/outputs/flutter-apk/app-normal-debug.apk
      - name: Verify KVM and provision API 36 system image
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo OX_R02_API36_KVM_DEVICE_MISSING >&2; exit 1; }
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm || { echo OX_R02_API36_KVM_UNAVAILABLE >&2; exit 1; }
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'system-images;android-36;google_apis;x86_64'
          avd_root="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$avd_root"
          available_kib="$(df -Pk "$avd_root" | awk 'END {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]] || { echo OX_R02_API36_DISK_QUERY_FAILED >&2; exit 1; }
          (( available_kib >= 4 * 1024 * 1024 )) || { echo OX_R02_API36_DISK_INSUFFICIENT >&2; exit 1; }
      - name: Install and launch ObtainX on disposable API 36 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # pinned
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 -B scripts/ci/r02_api36_smoke.py run --out "$RUNNER_TEMP/obtainx-r02-api36"
      - name: Independently verify source-bound installed APK and launch evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/r02_api36_smoke.py verify --out "$RUNNER_TEMP/obtainx-r02-api36"
      - name: Publish minimized emulator-only evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: obtainx-r02-api36-bootstrap-${{ github.sha }}
          path: |
            ${{ runner.temp }}/obtainx-r02-api36/receipt.json
            ${{ runner.temp }}/obtainx-r02-api36/app_launch.png
          if-no-files-found: warn
          retention-days: 7
