name: ObtainX R02 / RT02B Negative Installer API36

on:
  pull_request:
    paths:
      - 'lib/installers/**'
      - 'lib/providers/apps_provider_install.dart'
      - 'lib/providers/apps_provider_updates.dart'
      - 'lib/providers/installer_provider.dart'
      - 'lib/providers/external_install_bridge.dart'
      - 'lib/services/install_bundle_plan.dart'
      - 'lib/services/verified_obb_delivery.dart'
      - 'lib/services/artifact_file_work.dart'
      - 'integration_test/**'
      - 'android/**'
      - '.github/workflows/**'
      - 'scripts/ci/r02_rt02**'
      - 'scripts/ci/obtainx_ci_policy.py'
      - 'scripts/ci/r00_source_contract.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'docs/SECURITY_RELEASE_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obtainx-r02-rt02b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rt02b-negative-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - name: Enforce RT02B real rejection source and mutation contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s scripts/ci -p 'test_r02_rt02b_contract.py' -v
          python3 -B scripts/ci/r02_rt02b_contract.py --check
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # pinned v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter 3.47.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # pinned v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - name: Provision Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # pinned
      - name: Initialize fail-closed RT02 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/obtainx-rt02b/fixtures"
          printf '{"schema":1,"status":"NOT_RUN","hosted_emulator_only":true,"physical_device_qualified":false,"full_r02_matrix_qualified":false,"release_qualified":false,"publication_allowed":false}\n' > "$RUNNER_TEMP/obtainx-rt02b/rt02b-receipt.json"
      - name: Verify ephemeral KVM and API36 system image
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo OX_R02_RT02_KVM_MISSING >&2; exit 1; }
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm && test -w /dev/kvm || { echo OX_R02_RT02_KVM_REFUSED >&2; exit 1; }
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'system-images;android-36;google_apis;x86_64'
          avd_root="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$avd_root"
          available_kib="$(df -Pk "$avd_root" | awk 'END {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]] || { echo OX_R02_RT02_DISK_QUERY_REFUSED >&2; exit 1; }
          (( available_kib >= 4 * 1024 * 1024 )) || { echo OX_R02_RT02_DISK_REFUSED >&2; exit 1; }
      - name: Resolve Flutter integration-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze integration_test lib test
      - name: Compile and verify two isolated signing identities before emulator boot
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/r02_rt02_fixture.py --out "$RUNNER_TEMP/obtainx-rt02b/fixtures"
          python3 -B scripts/ci/r02_rt02b_fixture.py --out "$RUNNER_TEMP/obtainx-rt02b/fixtures"
          test -s "$RUNNER_TEMP/obtainx-rt02b/fixtures/fixture_inventory.json"
          test -s "$RUNNER_TEMP/obtainx-rt02b/fixtures/rt02b_inventory.json"
      - name: Real Android wrong-signature and downgrade rejection sessions
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # pinned
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash -c 'set -euo pipefail; python3 -B scripts/ci/r02_rt02b_hosted.py run --out "$RUNNER_TEMP/obtainx-rt02b"'
      - name: Independently verify negative Android package-state receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/r02_rt02b_hosted.py verify --out "$RUNNER_TEMP/obtainx-rt02b"
      - name: Publish minimized emulator-only evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: obtainx-r02-rt02b-rejection-${{ github.sha }}
          path: |
            ${{ runner.temp }}/obtainx-rt02b/rt02b-receipt.json
            ${{ runner.temp }}/obtainx-rt02b/rt02b-progress.json
            ${{ runner.temp }}/obtainx-rt02b/fixtures/rt02b_inventory.json
          if-no-files-found: warn
          retention-days: 7
